<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1 align="Center">Student Registration Form</h1>
    <hr align="center" width="50%">
    <form action="#" method="post" align="center">
        <label for="full_name">Full Name:</label>
        <input type="text" id="full_name" placeholder="Enter your full name" name="full_name">
        <br></br>
        <label for="roll_number">Roll Number:</label>
        <input type="text" id="roll_number" name="roll_number" placeholder="Enter your roll number">
        <br></br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
        <br></br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
        <br></br>
        <label for="address">Address:</label>
        <textarea id="address" rows="4" cols="50" name="address" placeholder="Enter your address"></textarea>
        <br></br>
        <input type="submit" value="Register">
        <input type="reset" value="Reset Form">
    </hr>
    </form>
    <p align="center">&copy; 2026 Student Registration Form. All rights reserved.</p>
</body>
</html>
