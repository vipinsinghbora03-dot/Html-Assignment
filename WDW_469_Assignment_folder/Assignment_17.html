<!DOCTYPE html>
<html>
<head>
    <title>Input Validation</title>
</head>
<body>

<form>

    Name:
    <input type="text" required>
    <br><br>

    Email:
    <input type="email" required>
    <br><br>

    Age:
    <input type="number" min="18" max="60" required>
    <br><br>

    Password:
    <input type="password"
           minlength="6"
           maxlength="12"
           required>

    <br><br>

    <input type="submit">

</form>

</body>
</html>
