<!DOCTYPE html>
<html>
<head>
    <title>Table Example</title>
</head>
<body>

<table border="1">
    <caption>Student Marks</caption>

    <thead>
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Rahul</td>
            <td>Math</td>
            <td>85</td>
        </tr>
        <tr>
            <td>Priya</td>
            <td>Science</td>
            <td>90</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="2">Average</td>
            <td>87.5</td>
        </tr>
    </tfoot>
</table>

</body>
</html>
